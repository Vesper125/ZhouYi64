<style>
  :root{
    --ink:#14171b;
    --ink-2:#1b1f24;
    --ink-3:#22272d;
    --ink-line: rgba(232,226,208,0.09);
    --ivory:#e9e3d3;
    --ivory-dim:#9a968a;
    --ivory-faint:#6b6a63;
    --seal:#b0392c;
    --seal-bright:#d4483a;
    --bronze:#a9823d;
    --bronze-dim:#7a6636;
    --yang: linear-gradient(180deg,#efe9d8,#dcd4bd);
    --radius: 2px;
    --wx-jin:#c9c2a0;
    --wx-mu:#7c9873;
    --wx-shui:#5e84a3;
    --wx-huo:#c1503f;
    --wx-tu:#b08b4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(176,57,44,0.07), transparent 60%),
      var(--ink);
    color:var(--ivory);
    font-family:'Noto Sans SC', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--seal); color:var(--ivory);}

  /* ---------- Header ---------- */
  header{
    padding: 34px 20px 20px;
    text-align:center;
    position:relative;
  }
  .seal-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;height:34px;
    background: var(--seal);
    color:#f3e9d8;
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:16px;
    border-radius:3px;
    margin-bottom:14px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 4px 14px rgba(176,57,44,0.35);
    transform:rotate(-2deg);
  }
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size: clamp(28px, 8vw, 42px);
    letter-spacing: 0.08em;
    margin: 0 0 6px;
    color: var(--ivory);
  }
  h1 small{
    display:block;
    font-size: 13px;
    font-weight:400;
    letter-spacing:0.3em;
    color: var(--bronze);
    margin-top: 8px;
    text-transform:uppercase;
  }
  .subtitle{
    color: var(--ivory-dim);
    font-size: 13.5px;
    max-width: 480px;
    margin: 10px auto 0;
    line-height:1.7;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    max-width: 560px;
    margin: 22px auto 0;
    padding: 0 20px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--ink-2);
    border: 1px solid var(--ink-line);
    border-radius: 999px;
    padding: 12px 18px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within{
    border-color: var(--bronze-dim);
    box-shadow: 0 0 0 3px rgba(169,130,61,0.12);
  }
  .search-box svg{ flex:none; opacity:0.55; }
  .search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--ivory);
    font-family:'Noto Sans SC', sans-serif;

: "亨。密云不雨，自我西郊。", "daxiang": "风行天上，小畜；君子以懿文德。", "meaning": "风行天上，密云不雨，力量尚小，蓄势待发。", "image": "西郊密云——云聚而未成雨，喻力量正在积蓄、尚未成势。", "keywords": ["蓄积", "小成", "克制", "待发"], "career": "阻力虽小但积累未足，宜韬光养晦、积蓄实力再图发展。", "wealth": "财富积累缓慢，宜小额稳健积累，不宜大举投资。", "love": "感情尚处磨合期，需以礼相待，耐心经营。", "health": "小恙宜及早调理，防微杜渐，不可轻忽。", "advice": "密云不雨，自我西郊——时机未熟，宜积蓄实力、修养文德以待时。"}, {"id": 10, "name": "履", "pinyin": "lǚ", "lower": "兑", "upper": "乾", "lowerNat": "泽", "upperNat": "天", "bits": "110111", "judgment": "履虎尾，不咥人，亨。", "daxiang": "上天下泽，履；君子以辩上下，定民志。", "meaning": "履虎尾而不受伤，象征谨慎行事、以礼而行。", "image": "履虎尾——如踩虎尾而不受伤，喻谨慎守礼可化险为夷。", "keywords": ["谨慎", "礼节", "履险", "处世"], "career": "处境虽有风险，若循礼守分、小心应对可化险为夷。", "wealth": "投资有风险但可控，须谨慎评估、按章行事。", "love": "感情中宜以礼相待、把握分寸，不可轻率冒犯。", "health": "需注意行动安全，防意外损伤。", "advice": "履虎尾不咥人——谦逊守礼、如履薄冰，方能化险为夷。"}, {"id": 11, "name": "泰", "pinyin": "tài", "lower": "乾", "upper": "坤", "lowerNat": "天", "upperNat": "地", "bits": "111000", "judgment": "小往大来，吉亨。", "daxiang": "天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。", "meaning": "天地交泰，阴阳调和，象征通泰吉祥、上下沟通。", "image": "天地交泰——阴阳相交、万物通畅，喻上下一心、时运亨通。", "keywords": ["通泰", "和谐", "交融", "兴盛"], "career": "时运亨通，上下配合默契，宜把握良机开拓进取。", "wealth": "财运亨通，收支平衡，宜适度扩张但防乐极生悲。", "love": "感情融洽和顺，双方心意相通，宜珍惜维系。", "health": "身心调和，气血通畅，宜保持规律防止懈怠。", "advice": "小往大来——盛世勿忘居安思危，防泰极转否。"}, {"id": 12, "name": "否", "pinyin": "pǐ", "lower": "坤", "upper": "乾", "lowerNat": "地", "upperNat": "天", "bits": "000111", "judgment": "否之匪人，不利君子贞，大往小来。", "daxiang": "天地不交，否；君子以俭德辟难，不可荣以禄。", "meaning": "天地不交，闭塞不通，象征阻滞、小人道长。", "image": "天地不交——阴阳隔绝、闭塞不通，喻小人道长、宜静守待时。", "keywords": ["闭塞", "阻滞", "退守", "俭德"], "career": "时运不济、上下不通，宜韬光养晦、静待转机，不宜强出头。", "wealth": "财运受阻，宜保守节俭，避免大额投资或涉险。", "love": "感情沟通受阻，宜先自省、暂缓推进，勿强求。", "health": "气机郁滞，宜疏解压力、调整心态，防抑郁沉闷。", "advice": "俭德辟难——收敛锋芒、安贫守分，静待否极泰来。"}, {"id": 13, "name": "同人", "pinyin": "tóng rén", "lower": "离", "upper": "乾", "lowerNat": "火", "upperNat": "天", "bits": "101111", "judgment": "同人于野，亨。利涉大川，利君子贞。", "daxiang": "天与火，同人；君子以类族辨物。", "meaning": "与人同心协力，象征团结众人、光明磊落。", "image": "同人于野——旷野之中与人协力，喻胸怀坦荡、不拘门户之见。", "keywords": ["同心", "协作", "光明", "包容"], "career": "宜团结志同道合者共谋大事，开放合作可成大局。", "wealth": "合伙经营有利，公开透明的合作更易获利。", "love": "志趣相投、坦诚相待的感情更为长久。", "health": "宜与人同乐、保持社交活跃，有助身心平衡。", "advice": "同人于野，利涉大川——胸怀宽广、不拘门户之见方能成事。"}, {"id": 14, "name": "大有", "pinyin": "dà yǒu", "lower": "乾", "upper": "离", "lowerNat": "天", "upperNat": "火", "bits": "111101", "judgment": "元亨。", "daxiang": "火在天上，大有；君子以遏恶扬善，顺天休命。", "meaning": "火在天上，光耀普照，象征大有丰收、德配天命。", "image": "日丽中天——光辉普照、万物丰盛，喻德业隆盛、谦以自守。", "keywords": ["丰收", "富足", "谦德", "顺天"], "career": "事业鼎盛、成果丰硕，宜谦逊自守、遏恶扬善以保长久。", "wealth": "财运极佳，收获颇丰，宜取之有道、善加分配。", "love": "感情美满丰盈，宜懂得感恩珍惜、不可骄纵。", "health": "精力旺盛、状态良好，仍需节制、防满而致溢。", "advice": "元亨——盛极之时更需谦德自持，顺应天道方能长保。"}, {"id": 15, "name": "谦", "pinyin": "qiān", "lower": "艮", "upper": "坤", "lowerNat": "山", "upperNat": "地", "bits": "001000", "judgment": "亨，君子有终。", "daxiang": "地中有山，谦；君子以裒多益寡，称物平施。", "meaning": "地中有山，外柔内刚，象征谦逊自守、终得善果。", "image": "谦谦君子——以谦卑之心涉险渡难，喻越有才德越应自抑。", "keywords": ["谦逊", "内敛", "均衡", "善终"], "career": "谦虚低调、脚踏实地者更受信任，终能获得成就。", "wealth": "财运稳健，宜量入为出、均衡分配，忌炫耀张扬。", "love": "谦和体贴的态度更能赢得感情长久稳固。", "health": "心态平和有助健康，宜劳逸均衡、不争不躁。", "advice": "谦谦君子，卑以自牧——越是有成就越应谦逊，方能有终。"}, {"id": 16, "name": "豫", "pinyin": "yù", "lower": "坤", "upper": "震", "lowerNat": "地", "upperNat": "雷", "bits": "000100", "judgment": "利建侯行师。", "daxiang": "雷出地奋，豫；先王以作乐崇德，殷荐之上帝，以配祖考。", "meaning": "雷出地奋，象征欢愉振奋、顺势而为。", "image": "雷出地奋——雷声震动、大地欢腾，喻顺势而为、鼓舞人心。", "keywords": ["欢愉", "顺势", "准备", "团结"], "career": "时机顺遂，宜积极筹划、鼓舞人心，顺势而为可成事。", "wealth": "财运向好，宜提前规划布局，把握顺势扩张的机会。", "love": "感情愉悦融洽，宜共同营造美好氛围，增进默契。", "health": "心情愉悦有助健康，但防安逸松懈、乐极生悲。", "advice": "利建侯行师——顺应时势、未雨绸缪，居安不忘思危。"}, {"id": 17, "name": "随", "pinyin": "suí", "lower": "震", "upper": "兑", "lowerNat": "雷", "upperNat": "泽", "bits": "100110", "judgment": "元亨利贞，无咎。", "daxiang": "泽中有雷，随；君子以向晦入宴息。", "meaning": "泽中有雷，随时而动，象征灵活顺应、择善而从。", "image": "泽中雷动——随时而息、顺应变化，喻灵活变通、择善而从。", "keywords": ["顺应", "灵活", "择善", "变通"], "career": "宜审时度势、随机应变，跟随正确的方向和领导。", "wealth": "财运需顺势而为，灵活调整策略，不可固执己见。", "love": "感情中宜彼此顺应、相互迁就，方能长久和谐。", "health": "作息宜顺应自然规律，劳逸随时调整。", "advice": "随时之义大矣哉——择善而从、顺时而动，方可无咎。"}, {"id": 18, "name": "蛊", "pinyin": "gǔ", "lower": "巽", "upper": "艮", "lowerNat": "风", "upperNat": "山", "bits": "011001", "judgment": "元亨，利涉大川。先甲三日，后甲三日。", "daxiang": "山下有风，蛊；君子以振民育德。", "meaning": "山下有风，积弊已久，象征革除旧弊、重整振兴。", "image": "皿中生虫——积弊已久、亟待整治，喻革除旧弊、重整家业。", "keywords": ["整饬", "革新", "补救", "振兴"], "career": "旧问题积重难返，宜果断整顿革新，方能扭转颓势。", "wealth": "财务或经营存在旧弊，需彻查整改，止损方能回升。", "love": "感情中积压的问题需正视处理，不可回避拖延。", "health": "宿疾旧患需及时诊治调理，不可讳疾忌医。", "advice": "先甲三日，后甲三日——革新须谋定后动，前后周全考虑。"}, {"id": 19, "name": "临", "pinyin": "lín", "lower": "兑", "upper": "坤", "lowerNat": "泽", "upperNat": "地", "bits": "110000", "judgment": "元亨利贞。至于八月有凶。", "daxiang": "泽上有地，临；君子以教思无穷，容保民无疆。", "meaning": "泽上有地，居高临下，象征临近盛大、教化临民。", "image": "二阳临下——居高临下、教化于民，喻以身作则、防盛而骄。", "keywords": ["临近", "壮大", "教导", "防盛极"], "career": "事业渐入佳境、影响力扩大，宜以身作则、善待下属。", "wealth": "财运渐旺，处于上升期，宜未雨绸缪防止后劲不足。", "love": "感情渐入热络，宜真诚包容，避免因得意而懈怠。", "health": "状态渐佳，仍需居安思危，防止盛极后转衰。", "advice": "至于八月有凶——盛时当思退路，教思无穷方能长保吉祥。"}, {"id": 20, "name": "观", "pinyin": "guān", "lower": "坤", "upper": "巽", "lowerNat": "地", "upperNat": "风", "bits": "000011", "judgment": "盥而不荐，有孚颙若。", "daxiang": "风行地上，观；先王以省方观民设教。", "meaning": "风行地上，象征观察省思、以身作则、教化于民。", "image": "盥而不荐——祭祀之初庄严未献，喻以诚敬之心观照自省。", "keywords": ["观察", "省思", "示范", "教化"], "career": "宜多观察形势、修身立德，以榜样感召他人而非强制。", "wealth": "财务决策前宜多观察分析，不宜草率行事。", "love": "感情中宜多观察理解对方内心，以诚意感化而非强求。", "health": "宜静心观照自身状态，防患于未然。", "advice": "盥而不荐，有孚颙若——以诚敬庄重之心自省示人，自能得众望。"}, {"id": 21, "name": "噬嗑", "pinyin": "shì kè", "lower": "震", "upper": "离", "lowerNat": "雷", "upperNat": "火", "bits": "100101", "judgment": "亨。利用狱。", "daxiang": "雷电噬嗑；先王以明罚敕法。", "meaning": "雷电交加，象征果断决断、排除障碍。", "image": "噬肉遇毒——咬合坚物、排除障碍，喻明察果断、扫除阻碍。", "keywords": ["决断", "排障", "执法", "清障"], "career": "遇到阻碍需果断处理，明察是非、公正执行方能突破。", "wealth": "财务纠纷或障碍需果断清理，拖延反致损失扩大。", "love": "感情中的隔阂需坦率沟通解决，不可含糊拖延。", "health": "需果断就医处理病痛，不可拖延讳疾。", "advice": "利用狱——明辨是非、果断处置，方能扫除阻碍、通达顺畅。"}, {"id": 22, "name": "贲", "pinyin": "bì", "lower": "离", "upper": "艮", "lowerNat": "火", "upperNat": "山", "bits": "101001", "judgment": "亨。小利有攸往。", "daxiang": "山下有火，贲；君子以明庶政，无敢折狱。", "meaning": "山下有火，文饰有度，象征文明修饰、内外兼修。", "image": "白贲无咎——文饰终归朴素本真，喻内外兼修、重质轻华。", "keywords": ["文饰", "修养", "内涵", "适度"], "career": "形象与实力并重，宜适度包装但更要重视内在实力。", "wealth": "理财宜讲究方法与规划，不可只重外表虚饰。", "love": "感情中适度的浪漫与仪式感能增进情意，但重在真心。", "health": "注重外在保养的同时，更应重视内在调养。", "advice": "小利有攸往——文饰有度、由质而文，过度装饰反失本真。"}, {"id": 23, "name": "剥", "pinyin": "bō", "lower": "坤", "upper": "艮", "lowerNat": "地", "upperNat": "山", "bits": "000001", "judgment": "不利有攸往。", "daxiang": "山附于地，剥；上以厚下安宅。", "meaning": "山附于地，剥落将尽，象征衰败将至、宜静守待时。", "image": "床剥及肤——床足渐次剥落将危及身，喻危机步步逼近、宜静守。", "keywords": ["剥落", "衰退", "守静", "待复"], "career": "处境不利、根基受损，宜收缩防守、静待时机转变。", "wealth": "财运走弱，资产易受侵蚀，宜保守持盈、避免损耗扩大。", "love": "感情出现裂痕征兆，宜正视问题、及早修复关系根基。", "health": "体质渐虚或旧疾复发迹象，宜及早调养、固本培元。", "advice": "不利有攸往——阳消阴长之时宜静守本分，厚待根基以待复兴。"}, {"id": 24, "name": "复", "pinyin": "fù", "lower": "震", "upper": "坤", "lowerNat": "雷", "upperNat": "地", "bits": "100000", "judgment": "亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。", "daxiang": "雷在地中，复；先王以至日闭关，商旅不行，后不省方。", "meaning": "雷在地中，一阳来复，象征否极泰来、转机初现。", "image": "一阳来复——冬至阳气初生渐长，喻否极泰来、转机初现。", "keywords": ["回归", "转机", "新生", "渐进"], "career": "低谷已过、转机初现，宜循序渐进、把握新生机遇。", "wealth": "财运开始回升，宜稳健积累，不宜急躁冒进求快。", "love": "感情出现和好或新生的契机，宜珍惜把握、循序发展。", "health": "身体机能开始恢复，宜温和调养、循序渐进康复。", "advice": "七日来复——顺应规律、把握时机复元，欲速则不达。"}, {"id": 25, "name": "无妄", "pinyin": "wú wàng", "lower": "震", "upper": "乾", "lowerNat": "雷", "upperNat": "天", "bits": "100111", "judgment": "元亨利贞。其匪正有眚，不利有攸往。", "daxiang": "天下雷行，物与无妄；先王以茂对时育万物。", "meaning": "天下雷行，物与无妄，象征真诚无妄、顺其自然。", "image": "无妄之灾——不耕而获反遭意外之祸，喻顺其自然、不可妄求。", "keywords": ["真诚", "自然", "不妄为", "守正"], "career": "宜脚踏实地、循正道行事，不可投机取巧或妄自尊大。", "wealth": "财运需靠正当途径积累，妄想不劳而获反招损失。", "love": "真诚自然的感情最为长久，勿存心机算计。", "health": "顺其自然、不妄加干预调理，过度治疗反而无益。", "advice": "其匪正有眚——但行正道、顺应自然，妄动妄求反招灾咎。"}, {"id": 26, "name": "大畜", "pinyin": "dà chù", "lower": "乾", "upper": "艮", "lowerNat": "天", "upperNat": "山", "bits": "111001", "judgment": "利贞，不家食吉，利涉大川。", "daxiang": "天在山中，大畜；君子以多识前言往行，以畜其德。", "meaning": "天在山中，蓄德积厚，象征大器蓄养、厚积薄发。", "image": "童牛之牿——及早约束童牛以防其暴，喻蓄德养才须防患未然。", "keywords": ["积蓄", "养德", "厚积", "薄发"], "career": "宜潜心积累学识才干，厚积薄发，终能担当大任。", "wealth": "财富宜稳健积蓄、长期规划，终能积少成多。", "love": "感情需要时间沉淀积累，不宜急于求成。", "health": "宜注重日常养生积累，滋补调养、固本培元。", "advice": "不家食吉——所学所蓄终为社会所用，厚积必有所成。"}, {"id": 27, "name": "颐", "pinyin": "yí", "lower": "震", "upper": "艮", "lowerNat": "雷", "upperNat": "山", "bits": "100001", "judgment": "贞吉。观颐，自求口实。", "daxiang": "山下有雷，颐；君子以慎言语，节饮食。", "meaning": "山下有雷，颐养之道，象征饮食调养、慎言养德。", "image": "朵颐垂涎——舍灵龟而贪口舌之欲，喻慎言节食、自食其力。", "keywords": ["颐养", "节制", "自养", "谨言"], "career": "宜自食其力、稳扎稳打，不依赖他人施舍。", "wealth": "理财宜量入为出、节制开支，自给自足方能长久。", "love": "感情需相互滋养扶持，言语上宜多加体谅、慎言。", "health": "直接关乎饮食健康，宜节饮食、慎言语，规律养生。", "advice": "慎言语，节饮食——修身养性从口入口出做起，涵养有节。"}, {"id": 28, "name": "大过", "pinyin": "dà guò", "lower": "巽", "upper": "兑", "lowerNat": "风", "upperNat": "泽", "bits": "011110", "judgment": "栋桡，利有攸往，亨。", "daxiang": "泽灭木，大过；君子以独立不惧，遁世无闷。", "meaning": "泽灭木，栋梁弯曲，象征非常时期、需果断应对。", "image": "枯杨生稊——老树重发新芽，喻非常之时逆境亦可焕发生机。", "keywords": ["非常", "压力", "担当", "变通"], "career": "处境压力巨大、非常规局面，需有非常之才、独立担当。", "wealth": "财务承压较大，需谨慎应对超常规风险，量力而行。", "love": "感情面临较大考验压力，需双方共同承担、灵活变通。", "health": "身心负荷较重，需警惕过度透支，适度减压调整。", "advice": "独立不惧，遁世无闷——非常之时守正持重，方能安然度过。"}, {"id": 29, "name": "坎", "pinyin": "kǎn", "lower": "坎", "upper": "坎", "lowerNat": "水", "upperNat": "水", "bits": "010010", "judgment": "习坎，有孚，维心亨，行有尚。", "daxiang": "水洊至，习坎；君子以常德行，习教事。", "meaning": "重重险陷，象征重重困难、以诚渡险。", "image": "重险相习——水流层层险陷交叠，喻身处困境唯诚可渡。", "keywords": ["险陷", "考验", "诚信", "渡厄"], "career": "面临重重困难险阻，宜保持内心诚信坚定，逐步渡过难关。", "wealth": "财务风险较高，宜谨慎防范、避免涉险投机。", "love": "感情面临考验波折，唯有真诚坚守方能共渡难关。", "health": "需警惕反复发作的隐患，宜持之以恒地调理护养。", "advice": "维心亨，行有尚——身处险境唯诚心坚定、脚踏实地方可渡厄。"}, {"id": 30, "name": "离", "pinyin": "lí", "lower": "离", "upper": "离", "lowerNat": "火", "upperNat": "火", "bits": "101101", "judgment": "利贞，亨。畜牝牛，吉。", "daxiang": "明两作，离；大人以继明照于四方。", "meaning": "光明相继，象征光明附丽、文明照耀。", "image": "日昃鼓缶——夕阳西下仍击缶而歌，喻顺应时运、坦然处之。", "keywords": ["光明", "依附", "文明", "持续"], "career": "事业如日中天，需依托正确方向和团队方能持续光明。", "wealth": "财运光明但需依托稳妥渠道，防虚火过旺。", "love": "感情热烈光明，需彼此依附扶持，勿因光耀而自负。", "health": "心火易旺，宜清心降火、劳逸有度。", "advice": "畜牝牛吉——保持柔顺谦和之德以承载光明，方能长久。"}, {"id": 31, "name": "咸", "pinyin": "xián", "lower": "艮", "upper": "兑", "lowerNat": "山", "upperNat": "泽", "bits": "001110", "judgment": "亨，利贞，取女吉。", "daxiang": "山上有泽，咸；君子以虚受人。", "meaning": "山上有泽，二气相感，象征男女相感、以诚相待。", "image": "咸其辅颊——感应由足趾渐至面颊，喻真情感应、循序渐深。", "keywords": ["感应", "相恋", "真诚", "交流"], "career": "人际感应良好，宜真诚沟通、以心换心促成合作。", "wealth": "财运需靠人脉感召与信任积累，真诚待人方能获利。", "love": "正值情投意合、良缘相感之时，宜真诚以对、把握良机。", "health": "身心感应敏锐，宜多留意情绪对身体的影响。", "advice": "虚受人——以谦虚开放之心感应他人，方能心意相通。"}, {"id": 32, "name": "恒", "pinyin": "héng", "lower": "巽", "upper": "震", "lowerNat": "风", "upperNat": "雷", "bits": "011100", "judgment": "亨，无咎，利贞，利有攸往。", "daxiang": "雷风，恒；君子以立不易方。", "meaning": "雷风相与，长久不变，象征恒心持久、坚守正道。", "image": "雷风相与——雷厉风行、长相伴随，喻夫妇之道贵在恒久如一。", "keywords": ["恒久", "坚持", "稳定", "持守"], "career": "宜坚持既定方向、持之以恒，切忌朝令夕改。", "wealth": "财运稳定细水长流，宜长期坚持稳健策略。", "love": "感情贵在长久坚持、彼此忠诚，不可见异思迁。", "health": "健康贵在坚持规律作息运动，非一朝一夕之功。", "advice": "立不易方——恒久之道在于坚定方向、始终如一。"}, {"id": 33, "name": "遁", "pinyin": "dùn", "lower": "艮", "upper": "乾", "lowerNat": "山", "upperNat": "天", "bits": "001111", "judgment": "亨，小利贞。", "daxiang": "天下有山，遁；君子以远小人，不恶而严。", "meaning": "天下有山，小人渐长，象征知机而退、远离是非。", "image": "肥遁无不利——退隐山林、心宽体胖，喻知机而退、明哲保身。", "keywords": ["退守", "远离", "知机", "自守"], "career": "局势对己不利，宜及早抽身引退、避开是非漩涡。", "wealth": "宜见好就收、及时止损，不可恋战贪多。", "love": "若感情已现裂痕征兆，宜理性抽身，不必强留。", "health": "宜适度休养、远离劳累源头，及早调整生活方式。", "advice": "远小人，不恶而严——退而不失尊严，明哲保身而非消极逃避。"}, {"id": 34, "name": "大壮", "pinyin": "dà zhuàng", "lower": "乾", "upper": "震", "lowerNat": "天", "upperNat": "雷", "bits": "111100", "judgment": "利贞。", "daxiang": "雷在天上，大壮；君子以非礼弗履。", "meaning": "雷在天上，阳刚强盛，象征力量强盛、宜守礼而行。", "image": "羝羊触藩——公羊猛撞篱笆反被困角，喻恃强冒进反受其累。", "keywords": ["强盛", "刚健", "克制", "守礼"], "career": "事业势头强劲，宜乘势而上，但需守礼有度、防恃强冒进。", "wealth": "财运旺盛，宜把握机遇扩张，但不可贪多冒进。", "love": "感情热烈主动，宜适度克制、尊重对方，勿强势压人。", "health": "精力充沛易致用力过猛，宜量力而行、防运动损伤。", "advice": "非礼弗履——强盛之时更需守礼有度，否则壮而致凶。"}, {"id": 35, "name": "晋", "pinyin": "jìn", "lower": "坤", "upper": "离", "lowerNat": "地", "upperNat": "火", "bits": "000101", "judgment": "康侯用锡马蕃庶，昼日三接。", "daxiang": "明出地上，晋；君子以自昭明德。", "meaning": "明出地上，象征晋升向上、光明前进。", "image": "晋如鼫鼠——如大鼠般贪多疑惧难安，喻晋升之时戒贪多务得。", "keywords": ["晋升", "进步", "光明", "顺遂"], "career": "事业顺遂上升，深受赏识提拔，宜积极展现才能。", "wealth": "财运渐入佳境，收入稳步提升，宜把握晋升良机。", "love": "感情关系日渐明朗深入，宜坦诚以对、共同进步。", "health": "精神状态积极向上，宜保持良好心态促进康复。", "advice": "自昭明德——晋升之时更应彰显自身德行才能，实至名归。"}, {"id": 36, "name": "明夷", "pinyin": "míng yí", "lower": "离", "upper": "坤", "lowerNat": "火", "upperNat": "地", "bits": "101000", "judgment": "利艰贞。", "daxiang": "明入地中，明夷；君子以莅众，用晦而明。", "meaning": "明入地中，光明受损，象征韬光养晦、忍辱负重。", "image": "明夷垂翼——飞鸟光明受损、低翼而飞，喻贤者受困仍守节不移。", "keywords": ["韬晦", "隐忍", "自守", "待时"], "career": "处境不利、才能受压，宜韬光养晦、内敛锋芒以自保。", "wealth": "财运受阻或有损失，宜低调守成，避免张扬冒险。", "love": "感情中受到误解或压抑，宜暂时隐忍、耐心等待转机。", "health": "身心承压易致郁结，宜调节情绪、内养正气。", "advice": "用晦而明——外示柔顺内守光明，艰难时期尤重气节坚守。"}, {"id": 37, "name": "家人", "pinyin": "jiā rén", "lower": "离", "upper": "巽", "lowerNat": "火", "upperNat": "风", "bits": "101011", "judgment": "利女贞。", "daxiang": "风自火出，家人；君子以言有物而行有恒。", "meaning": "风自火出，象征家庭和睦、各正其位。", "image": "闲有家——治家宜先立规矩以防患未然，喻齐家先正己身。", "keywords": ["家庭", "和睦", "本分", "治家"], "career": "宜像治家一般讲求秩序分工，团队各司其职方能兴旺。", "wealth": "家庭财务宜共同规划、量入为出，家和万事兴。", "love": "婚姻家庭运佳，宜各尽本分、言而有信、以身作则。", "health": "家庭氛围和睦有助身心健康，宜重视家人关怀。", "advice": "言有物而行有恒——治家治业贵在言行一致、恪守本分。"}, {"id": 38, "name": "睽", "pinyin": "kuí", "lower": "兑", "upper": "离", "lowerNat": "泽", "upperNat": "火", "bits": "110101", "judgment": "小事吉。", "daxiang": "上火下泽，睽；君子以同而异。", "meaning": "火泽相违，志趣相背，象征暂时乖离、异中求同。", "image": "见豕负涂——恍见污泥载豕、满车皆鬼，喻猜疑生幻象，宜释疑求同。", "keywords": ["分歧", "隔阂", "求同", "沟通"], "career": "团队或合作中存在分歧对立，宜求同存异、小心处理。", "wealth": "财务合作中意见不合，宜多方沟通协调，避免决裂。", "love": "感情出现隔阂误会，需耐心沟通化解，不宜彻底决裂。", "health": "情绪易波动对立，宜疏导心结、调和身心矛盾。", "advice": "同而异——在分歧中寻求包容理解，异中求同小事可吉。"}, {"id": 39, "name": "蹇", "pinyin": "jiǎn", "lower": "艮", "upper": "坎", "lowerNat": "山", "upperNat": "水", "bits": "001010", "judgment": "利西南，不利东北。利见大人，贞吉。", "daxiang": "山上有水，蹇；君子以反身修德。", "meaning": "山上有水，行走艰难，象征前路险阻、宜反身修德。", "image": "王臣蹇蹇——为国事艰难跋涉、在所不辞，喻遇阻挺身、忠于职守。", "keywords": ["险阻", "受挫", "自省", "借力"], "career": "前进道路遭遇重重障碍，宜暂缓推进、反躬自省，借助贵人相助。", "wealth": "财运受阻、资金周转困难，宜谨慎保守、寻求外援。", "love": "感情遭遇现实阻碍，需彼此体谅扶持、共渡难关。", "health": "行动或病情受阻不畅，宜耐心调养、寻求良医相助。", "advice": "反身修德——遇阻不宜强行，宜反省自身、借助贵人渡过难关。"}, {"id": 40, "name": "解", "pinyin": "xiè", "lower": "坎", "upper": "震", "lowerNat": "水", "upperNat": "雷", "bits": "010100", "judgment": "利西南。无所往，其来复吉。有攸往，夙吉。", "daxiang": "雷雨作，解；君子以赦过宥罪。", "meaning": "雷雨交作，郁结舒解，象征困境解除、宽释释怀。", "image": "田获三狐——田猎中猎获三只狐狸，喻困扰解除、清理积患。", "keywords": ["解脱", "释放", "宽恕", "新生"], "career": "困境逐渐解除，宜把握时机推进，但不宜纠缠旧怨。", "wealth": "财务压力得以缓解，宜及时清理旧账、轻装上阵。", "love": "感情中的误会矛盾得以化解，宜宽容释怀、重新开始。", "health": "身心郁结得以舒解，宜借此机会调养恢复元气。", "advice": "赦过宥罪——困境已解，宜宽以待人，尽早了结旧怨轻装前行。"}, {"id": 41, "name": "损", "pinyin": "sǔn", "lower": "兑", "upper": "艮", "lowerNat": "泽", "upperNat": "山", "bits": "110001", "judgment": "有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。", "daxiang": "山下有泽，损；君子以惩忿窒欲。", "meaning": "山下有泽，损下益上，象征节制克己、有舍有得。", "image": "损刚益柔——减损刚强以增益柔顺，喻克己让利、终成大义。", "keywords": ["节制", "克己", "舍得", "诚信"], "career": "需暂时牺牲部分利益以成全大局，克制欲望方能长远获益。", "wealth": "财运需先舍后得，宜节制开支、量力而行，忌贪多冒进。", "love": "感情中需懂得付出与牺牲，克制自我以成全对方。", "health": "需节制饮食欲望、克制不良嗜好，方能养身。", "advice": "惩忿窒欲——损己利人非损，克制情欲私念反能成就长远。"}, {"id": 42, "name": "益", "pinyin": "yì", "lower": "震", "upper": "巽", "lowerNat": "雷", "upperNat": "风", "bits": "100011", "judgment": "利有攸往，利涉大川。", "daxiang": "风雷，益；君子以见善则迁，有过则改。", "meaning": "风雷相益，损上益下，象征增益进取、见善则迁。", "image": "或击之——外力或有冲击仍需持心以恒，喻增益之时不可懈怠初心。", "keywords": ["增益", "进取", "施予", "改过"], "career": "时运有利、贵人相助，宜积极进取、勇于开拓新局面。", "wealth": "财运渐增，宜把握有利时机拓展，同时乐善好施更添福报。", "love": "感情关系日渐增进，宜相互扶持、共同成长进步。", "health": "身体状况渐有改善，宜积极调养、见效即巩固。", "advice": "见善则迁，有过则改——把握有利时机进取，并勇于自我改善。"}, {"id": 43, "name": "夬", "pinyin": "guài", "lower": "乾", "upper": "兑", "lowerNat": "天", "upperNat": "泽", "bits": "111110", "judgment": "扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。", "daxiang": "泽上于天，夬；君子以施禄及下，居德则忌。", "meaning": "泽上于天，决而不疑，象征果决行动、清除小人。", "image": "壮于前趾——脚趾先行、示意果决前行，喻决断行事宜谋定后动。", "keywords": ["决断", "清除", "警惕", "果敢"], "career": "需果断清除积弊或障碍，行动前宜先礼后兵、师出有名。", "wealth": "需果断处理不良资产或纠纷，但不可诉诸激进手段。", "love": "感情中需果断解决拖延已久的问题，勿再犹豫不决。", "health": "需果断处理隐患病症，不可再拖延忽视。", "advice": "不利即戎，利有攸往——果决行事但避免激烈冲突，循序推进为宜。"}, {"id": 44, "name": "姤", "pinyin": "gòu", "lower": "巽", "upper": "乾", "lowerNat": "风", "upperNat": "天", "bits": "011111", "judgment": "女壮，勿用取女。", "daxiang": "天下有风，姤；后以施命诰四方。", "meaning": "天下有风，一阴始生，象征不期而遇、慎防渐长。", "image": "系于金柅——以金属车闸制止车轮，喻遇微阴初生、宜及早制约。", "keywords": ["相遇", "萌芽", "警惕", "慎始"], "career": "新的机会或变数悄然出现，宜留心观察、谨慎应对。", "wealth": "需警惕看似微小的风险因素，防止日后坐大成患。", "love": "或有意外的邂逅缘分，宜理性判断、不可轻率托付。", "health": "小病小恙初现苗头，宜及早重视、防微杜渐。", "advice": "女壮，勿用取女——初生之势虽小，仍需谨慎对待、慎始防微。"}, {"id": 45, "name": "萃", "pinyin": "cuì", "lower": "坤", "upper": "兑", "lowerNat": "地", "upperNat": "泽", "bits": "000110", "judgment": "亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。", "daxiang": "泽上于地，萃；君子以除戎器，戒不虞。", "meaning": "泽上于地，人心聚合，象征聚集人才、共襄盛举。", "image": "萃如嗟如——聚而复散、令人叹息，喻聚合人心需以诚相待。", "keywords": ["聚合", "团结", "共襄", "防患"], "career": "宜广纳贤才、凝聚团队力量，共同成就一番事业。", "wealth": "宜集中资源合力经营，聚合人脉资金以壮大声势。", "love": "感情或家族聚会融洽，宜珍惜团聚时光、增进情谊。", "health": "宜结伴调养、互相扶持，同时需防聚集处的健康隐患。", "advice": "除戎器，戒不虞——人心聚合之时更需未雨绸缪、防患未然。"}, {"id": 46, "name": "升", "pinyin": "shēng", "lower": "巽", "upper": "坤", "lowerNat": "风", "upperNat": "地", "bits": "011000", "judgment": "元亨，用见大人，勿恤，南征吉。", "daxiang": "地中生木，升；君子以顺德，积小以高大。", "meaning": "地中生木，柔顺上升，象征稳步上升、循序渐进。", "image": "升虚邑——如入无人之邑畅行无阻，喻上升之路顺畅、宜守正渐进。", "keywords": ["上升", "渐进", "谦逊", "顺势"], "career": "事业稳步上升，宜脚踏实地、循序渐进，终能崭露头角。", "wealth": "财运稳步增长，宜持续积累、切勿急躁冒进求快。", "love": "感情稳步加深，宜自然发展、水到渠成。", "health": "体能状态逐步提升，宜坚持规律调养、循序渐进恢复。", "advice": "积小以高大——升迁之道贵在顺德渐进，一步一个脚印。"}, {"id": 47, "name": "困", "pinyin": "kùn", "lower": "坎", "upper": "兑", "lowerNat": "水", "upperNat": "泽", "bits": "010110", "judgment": "亨，贞，大人吉，无咎，有言不信。", "daxiang": "泽无水，困；君子以致命遂志。", "meaning": "泽无水，身处困境，象征逆境考验、守志不移。", "image": "臀困株木——坐卧枯木之上、进退维谷，喻身处困境仍需坚守心志。", "keywords": ["困顿", "考验", "坚守", "信念"], "career": "处境艰难受困，纵有理却难获信任，宜坚守志向、静待转机。", "wealth": "财务陷入困顿窘迫，宜量入为出、渡过难关。", "love": "感情中言语难以取信，宜以行动而非言语证明真心。", "health": "身心俱疲、状态低迷，宜坚持调养、切勿灰心放弃。", "advice": "致命遂志——身处困境更应坚守本心志向，逆境亦能成就人格。"}, {"id": 48, "name": "井", "pinyin": "jǐng", "lower": "巽", "upper": "坎", "lowerNat": "风", "upperNat": "水", "bits": "011010", "judgment": "改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。", "daxiang": "木上有水，井；君子以劳民劝相。", "meaning": "木上有水，井养不穷，象征滋养他人、恒常有用。", "image": "井渫不食——井水已淘净却无人食用，喻怀才不遇仍应静待任用。", "keywords": ["滋养", "恒常", "利他", "修井"], "career": "宜像水井一样默默奉献滋养他人，稳固自身根基修养。", "wealth": "财源需细水长流、持续经营，切忌半途而废前功尽弃。", "love": "感情贵在持续滋养、相互扶持，不可半途懈怠。", "health": "需持续调养固本，防止调理不彻底而反复。", "advice": "羸其瓶，凶——功亏一篑最为可惜，行百里者半九十，务必善始善终。"}, {"id": 49, "name": "革", "pinyin": "gé", "lower": "离", "upper": "兑", "lowerNat": "火", "upperNat": "泽", "bits": "101110", "judgment": "已日乃孚，元亨利贞，悔亡。", "daxiang": "泽中有火，革；君子以治历明时。", "meaning": "泽中有火，变革除旧，象征顺势变革、革故鼎新。", "image": "巩用黄牛——以黄牛皮革坚固捆缚，喻变革之初宜先固本待时。", "keywords": ["变革", "除旧", "时机", "信服"], "career": "变革时机已经成熟，宜果断推进改革创新，但需师出有名。", "wealth": "财务或经营模式需与时俱进变革，因循守旧恐失良机。", "love": "感情关系或需重新调整定位，顺应变化、坦诚沟通。", "health": "需改变旧有不良生活习惯，方能革除病根。", "advice": "已日乃孚——变革需取信于人、时机成熟后方可推行，操之过急反生悔。"}, {"id": 50, "name": "鼎", "pinyin": "dǐng", "lower": "巽", "upper": "离", "lowerNat": "风", "upperNat": "火", "bits": "011101", "judgment": "元吉，亨。", "daxiang": "木上有火，鼎；君子以正位凝命。", "meaning": "木上有火，鼎新烹饪，象征稳重承担、汇聚人才。", "image": "鼎折覆餗——鼎足折断、倾覆佳肴，喻力不胜任、慎选托付之人。", "keywords": ["稳重", "承担", "汇聚", "任重"], "career": "宜稳重承担重任，善用人才资源，成就一番新气象。", "wealth": "财运吉祥，宜汇聚多方资源共谋发展，稳中求进。", "love": "感情关系趋于稳定成熟，宜共同承担责任、经营家庭。", "health": "宜注重饮食调养，滋补身体、稳固根基。", "advice": "正位凝命——身居其位应端正自身、凝聚使命，方能担当大任。"}, {"id": 51, "name": "震", "pinyin": "zhèn", "lower": "震", "upper": "震", "lowerNat": "雷", "upperNat": "雷", "bits": "100100", "judgment": "亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。", "daxiang": "洊雷，震；君子以恐惧修省。", "meaning": "雷声震动，惊而后定，象征警醒自省、临危不乱。", "image": "震来虩虩——雷声乍响、令人惶恐自省，喻遇变不乱、修省避祸。", "keywords": ["震动", "警醒", "自省", "镇定"], "career": "或遇突发变故或强烈竞争冲击，宜保持镇定、以修省应对。", "wealth": "财务可能遭遇突发波动，宜提前防范、保持冷静应对。", "love": "感情中或有突发冲突或惊扰，宜冷静沟通、不宜慌乱。", "health": "需警惕突发状况，保持心态平稳、及时就医。", "advice": "恐惧修省——震惊之余更应自我反省修养，方能转危为安。"}, {"id": 52, "name": "艮", "pinyin": "gèn", "lower": "艮", "upper": "艮", "lowerNat": "山", "upperNat": "山", "bits": "001001", "judgment": "艮其背，不获其身，行其庭，不见其人，无咎。", "daxiang": "兼山，艮；君子以思不出其位。", "meaning": "山之静止，止于当止，象征止静自守、克制欲念。", "image": "艮背不获身——止定如背部不动而无欲，喻止于当止、内心安定。", "keywords": ["静止", "克制", "内省", "守分"], "career": "宜稳守本分、不妄动躁进，明确职责范围、专注当下。", "wealth": "财运宜静守稳健，不宜频繁进出或盲目扩张。", "love": "感情宜保持适当距离与分寸，不可强求或过度介入。", "health": "宜静心养神、减少妄动耗神，有助身心安定。", "advice": "思不出其位——各安其位、止于当止，内心笃定方能无咎。"}, {"id": 53, "name": "渐", "pinyin": "jiàn", "lower": "艮", "upper": "巽", "lowerNat": "山", "upperNat": "风", "bits": "001011", "judgment": "女归吉，利贞。", "daxiang": "山上有木，渐；君子以居贤德善俗。", "meaning": "山上有木，循序渐进，象征稳步发展、按部就班。", "image": "鸿渐于陆——鸿雁循序渐进、迁徙栖息，喻循序渐进、按部就班。", "keywords": ["渐进", "稳步", "守正", "善俗"], "career": "事业发展宜循序渐进、按部就班，不可急躁求快。", "wealth": "财富积累宜稳扎稳打，长期规划胜过短期投机。", "love": "感情宜循序渐进发展，如女子出嫁般郑重而不仓促。", "health": "康复调养需循序渐进，切忌操之过急、欲速不达。", "advice": "居贤德善俗——渐进之道贵在坚守正道、涵养品德以化育风气。"}, {"id": 54, "name": "归妹", "pinyin": "guī mèi", "lower": "兑", "upper": "震", "lowerNat": "泽", "upperNat": "雷", "bits": "110100", "judgment": "征凶，无攸利。", "daxiang": "泽上有雷，归妹；君子以永终知敝。", "meaning": "泽上有雷，名不正而行，象征名分不正、宜谨慎行事。", "image": "帝乙归妹——尊贵之女下嫁犹须谨慎，喻名分处置须思虑长远。", "keywords": ["名分", "谨慎", "克制", "长远"], "career": "处境或名分有所不正，宜谨慎行事、量力而为，不可躁进冒失。", "wealth": "财务安排需考虑长远、名正言顺，避免不正当途径获利。", "love": "感情关系中名分或有不妥，宜三思而后行，不宜仓促决定。", "health": "需注重长期调养而非急功近利，方能长久获益。", "advice": "永终知敝——凡事须思虑长远结果，慎重对待关系的名分与归宿。"}, {"id": 55, "name": "丰", "pinyin": "fēng", "lower": "离", "upper": "震", "lowerNat": "火", "upperNat": "雷", "bits": "101100", "judgment": "亨，王假之，勿忧，宜日中。", "daxiang": "雷电皆至，丰；君子以折狱致刑。", "meaning": "雷电皆至，光明盛大，象征丰盛鼎盛、盛极当忧。", "image": "日中见斗——正午时分竟见星斗晦暗，喻盛极之中当防忽现之患。", "keywords": ["丰盛", "鼎盛", "忧患", "持中"], "career": "事业处于鼎盛丰收之时，宜居安思危、防止盛极而衰。", "wealth": "财运丰厚、收获颇丰，宜合理分配、不可挥霍无度。", "love": "感情丰盈美满，宜珍惜当下、维系长久，勿因得意而疏忽。", "health": "状态处于顶峰，仍需注意劳逸平衡，防盛极转衰。", "advice": "宜日中——盛大之时如日中天，更应把握分寸、防止过犹不及。"}, {"id": 56, "name": "旅", "pinyin": "lǚ", "lower": "艮", "upper": "离", "lowerNat": "山", "upperNat": "火", "bits": "001101", "judgment": "小亨，旅贞吉。", "daxiang": "山上有火，旅；君子以明慎用刑，而不留狱。", "meaning": "山上有火，羁旅在外，象征漂泊不定、宜谨慎柔顺。", "image": "鸟焚其巢——羁旅漂泊如鸟巢被焚，喻旅居在外、谨言慎行为要。", "keywords": ["漂泊", "谨慎", "柔顺", "适应"], "career": "处于变动漂泊、身处异地之境，宜谨言慎行、随遇而安。", "wealth": "财运不稳定，宜量入为出、避免大额投资异地事务。", "love": "感情或聚少离多，宜彼此体谅、保持联系与信任。", "health": "奔波劳顿易致身心疲惫，宜注意休息调养、量力而行。", "advice": "明慎用刑，不留狱——羁旅之时行事宜谨慎周全、不留后患。"}, {"id": 57, "name": "巽", "pinyin": "xùn", "lower": "巽", "upper": "巽", "lowerNat": "风", "upperNat": "风", "bits": "011011", "judgment": "小亨，利有攸往，利见大人。", "daxiang": "随风，巽；君子以申命行事。", "meaning": "风行无孔不入，柔顺渐进，象征谦逊顺从、反复申命。", "image": "巽在床下——过度谦卑、俯首于床下，喻谦逊固好但不可卑弱失度。", "keywords": ["谦逊", "渐入", "顺从", "沟通"], "career": "宜以谦和柔顺的方式推进事务，反复沟通说明更易获支持。", "wealth": "财运渐进温和增长，宜循序渐进、避免强硬手段。", "love": "感情宜以柔克刚、耐心沟通，不宜强求硬碰。", "health": "宜温和调理，如风般徐徐渐进，不可急于求成。", "advice": "申命行事——谦逊柔顺并非软弱，反复申明立场方能事成。"}, {"id": 58, "name": "兑", "pinyin": "duì", "lower": "兑", "upper": "兑", "lowerNat": "泽", "upperNat": "泽", "bits": "110110", "judgment": "亨，利贞。", "daxiang": "丽泽，兑；君子以朋友讲习。", "meaning": "两泽相连，喜悦交流，象征欣悦沟通、朋友讲习。", "image": "引兑未宁——被牵引而喜、内心难安，喻交游取悦宜出于诚而非谄媚。", "keywords": ["喜悦", "沟通", "交流", "分享"], "career": "人际关系融洽、沟通顺畅，宜多与同侪交流切磋、共同进步。", "wealth": "财运在愉悦融洽的合作氛围中较易获利，宜广结善缘。", "love": "感情氛围愉悦和睦，宜多交流分享、增进彼此了解。", "health": "心情愉悦有助身心健康，宜多参与令人愉快的社交活动。", "advice": "朋友讲习——以喜悦之心与人交流切磋，方能相互增益。"}, {"id": 59, "name": "涣", "pinyin": "huàn", "l   if(KE[l] === u) return {type:"相克（下克上）", desc:`下卦「${l}」克上卦「${u}」，根基对外在形成制约，向外发展易受掣肘，需调和内外、循序化解。`};

function hexLinesHTML(bits, big){
  // bits: 6 chars, index0 = bottom line
  let out = '';
  for(let i=0;i<6;i++){
    if(bits[i] === '1'){
      out += `<div class="yao yang"></div>`;
    } else {
      out += `<div class="yao yin"><span></span><span></span></div>`;
    }
  }
  return `<div class="hexlines">${out}</div>`;
}

function miniHexHTML(bits3){
  let out = '';
  for(let i=0;i<3;i++){
    if(bits3[i]==='1') out += `<div class="yao yang"></div>`;
    else out += `<div class="yao yin"><span></span><span></span></div>`;
  }
  return `<div class="b-hex">${out}</div>`;
}

    <div class="tdir">${dir}</div>

function renderBaguaDiagram(mode){
  const slots = {tl:null,t:null,tr:null,l:null,r:null,bl:null,b:null,br:null};
  TRIGRAMS.forEach(tri=>{
    const slot = mode==='fuxi' ? TRI_META[tri].fuxiSlot : TRI_META[tri].houtianSlot;

  });
  const centerLabel = mode==='fuxi' ? '先天八卦<br>伏羲圆图' : '后天八卦<br>文王圆图';
  return `<div class="bagua-diagram">
    ${baguaCellHTML(slots.tl, mode)}
    ${baguaCellHTML(slots.t, mode)}
    ${baguaCellHTML(slots.tr, mode)}
    ${baguaCellHTML(slots.l, mode)}

    ${baguaCellHTML(slots.r, mode)}
    ${baguaCellHTML(slots.bl, mode)}

}

    <div class="bagua-tabs">
      <div class="bagua-tab ${mode==='palace'?'active':''}" data-mode="palace">十二宫</div>
      <div class="bagua-tab ${mode==='star'?'active':''}" data-mode="star">十四主星</div>
      <div class="bagua-tab ${mode==='number'?'active':''}" data-mode="number">数字与辅星</div>
    </div>

    ${mode==='palace' ? renderPalaceList() : mode==='star' ? renderStarList() : renderNumberList()}
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeDetail);
  panel.querySelectorAll('.bagua-tab').forEach(t=>{
    t.addEventListener('click', ()=> openZiweiPanel(t.dataset.mode));
  });
  panel.scrollTop = 0;
}

document.getElementById('ziweiBtn').addEventListener('click', ()=> openZiweiPanel('palace'));

function tileHTML(h, idx){
  return `<button class="tile" data-id="${h.id}" style="animation-delay:${Math.min(idx*10,400)}ms" aria-label="第${h.id}卦 ${h.name}">
    ${hexLinesHTML(h.bits)}
    <div class="num">${String(h.id).padStart(2,'0')}</div>
    <div class="nm">${h.name}</div>
  </button>`;
}

function renderGrid(list){
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state">未找到匹配的卦象<br>试试输入卦序 1–64 或卦名，如「乾」「坤」「既济」</div>`;
    countLine.textContent = '';
    return;
  }
  grid.innerHTML = list.map((h,i)=>tileHTML(h,i)).join('');
  countLine.textContent = `显示 ${list.length} / 64 卦`;
  grid.querySelectorAll('.tile').forEach(t=>{
    t.addEventListener('click', ()=> openDetail(parseInt(t.dataset.id)));
  });
}

function renderChips(){
  chipRow.innerHTML = TRIGRAMS.map(t=>`<div class="chip" data-tri="${t}">${t}卦</div>`).join('') + `<div class="chip" data-tri="__all">全部</div>`;
  chipRow.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      chipRow.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      const tri = c.dataset.tri;
      searchInput.value = '';
      if(tri === '__all'){ renderGrid(DATA); }
      else { renderGrid(DATA.filter(h=> h.upper===tri || h.lower===tri)); }
    });
  });
  chipRow.querySelector('[data-tri="__all"]').classList.add('active');
}

function pinyinInitials(py){
  return py.split(' ').map(s=>s[0]).join('');
}

function doSearch(q){
  q = q.trim().toLowerCase();
  chipRow.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  if(!q){ chipRow.querySelector('[data-tri="__all"]').classList.add('active'); renderGrid(DATA); return; }
  const asNum = parseInt(q);
  const results = DATA.filter(h=>{
    if(!isNaN(asNum) && h.id === asNum) return true;
    if(h.name.includes(q)) return true;
    if(h.pinyin.toLowerCase().includes(q)) return true;
    if(pinyinInitials(h.pinyin).includes(q)) return true;
    if(h.keywords.some(k=>k.includes(q))) return true;
    return false;
  });
  renderGrid(results);
}

searchInput.addEventListener('input', (e)=> doSearch(e.target.value));

function openDetail(id){
  const h = DATA.find(x=>x.id===id);
  if(!h) return;
  panel.innerHTML = `
    <div class="panel-drag"></div>
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="detail-head">
      ${hexLinesHTML(h.bits, true)}
      <div class="detail-titles">
        <div class="eyebrow">第 ${h.id} 卦 · ${h.pinyin}</div>
        <h2>${h.name}</h2>
        <div class="composition">${h.upperNat}${h.upper} 上 ／ ${h.lowerNat}${h.lower} 下 &nbsp;·&nbsp; ${h.upperNat}${h.lowerNat}${h.name}</div>
      </div>
    </div>

    <div class="kw-row">${h.keywords.map(k=>`<span class="kw">${k}</span>`).join('')}</div>

    <div class="section">
      <div class="label">五行对应</div>
      <div class="wux-pair">
        <div class="wux-col">
          <div class="wc-label">上卦</div>
          <div class="wc-tri">${h.upper}</div>
          ${wuxTag(TRI_META[h.upper].wuxing)}
        </div>
        <div class="wux-col">
          <div class="wc-label">下卦</div>
          <div class="wc-tri">${h.lower}</div>
          ${wuxTag(TRI_META[h.lower].wuxing)}
        </div>
      </div>
      <div class="wux-rel"><b>${wuxRelation(TRI_META[h.upper].wuxing, TRI_META[h.lower].wuxing).type}</b> — ${wuxRelation(TRI_META[h.upper].wuxing, TRI_META[h.lower].wuxing).desc}</div>
    </div>

    <div class="section">
      <div class="label">延伸类象 · 方位 / 人体 / 动物 / 物品</div>
      <div class="extra-pair">
        ${triExtraCard(h.upper, '上')}
        ${triExtraCard(h.lower, '下')}
      </div>
      <div class="extra-note">※ 以上按《说卦传》八卦类象，依本卦上、下卦组合推衍而得，供参考对照，非六十四卦独立定象。</div>
    </div>

    <div class="section">
      <div class="label">卦辞 · 彖</div>
      <p class="classical">${h.judgment}</p>
    </div>

    <div class="section">
      <div class="label">象辞 · 大象</div>
      <p class="classical">${h.daxiang}</p>
    </div>

    <div class="section">
      <div class="label">意象</div>
      <div class="image-box">${h.image}</div>
    </div>

    <div class="section">
      <div class="label">卦意</div>
      <p class="txt">${h.meaning}</p>
    </div>

    <div class="section">
      <div class="label">诸事解读</div>
      <div class="aspect-grid">
        <div class="aspect"><div class="a-title"><span class="dot"></span>事业</div><div class="a-txt">${h.career}</div></div>
        <div class="aspect"><div class="a-title"><span class="dot"></span>财运</div><div class="a-txt">${h.wealth}</div></div>
        <div class="aspect"><div class="a-title"><span class="dot"></span>感情</div><div class="a-txt">${h.love}</div></div>
        <div class="aspect"><div class="a-title"><span class="dot"></span>健康</div><div class="a-txt">${h.health}</div></div>
      </div>
    </div>

    <div class="section advice-box">
      <div class="label">决策提示</div>
      <p>${h.advice}</p>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← 上一卦</button>
      <button class="nav-btn" id="nextBtn">下一卦 →</button>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeDetail);
  document.getElementById('prevBtn').addEventListener('click', ()=> openDetail(h.id===1?64:h.id-1));
  document.getElementById('nextBtn').addEventListener('click', ()=> openDetail(h.id===64?1:h.id+1));
  panel.scrollTop = 0;
}

function closeDetail(){ overlay.classList.remove('open'); }
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeDetail(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeDetail(); });

renderChips();
renderGrid(DATA);

// ---------- PWA: service worker + install prompt ----------
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = 'inline-flex';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>
</body>
</html>
